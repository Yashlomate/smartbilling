{% extends 'base.html' %}
{% block title %}New Customer{% endblock %}
{% block content %}
<h2>Add Customer</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save Customer</button>
    <a href="{% url 'invoice_create' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
